
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC+IA - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-navy: #101828;
            --brand-yellow: #FACC15;
            --brand-navy-light: #1e293b;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--brand-navy); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f1a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand-yellow); }

        @keyframes slide-left {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-left {
            animation: slide-left 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes slide-up {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slide-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-8px); }
          50% { transform: translateX(8px); }
          75% { transform: translateX(-8px); }
        }
        .animate-shake {
          animation: shake 0.4s ease-in-out;
        }

        .custom-scrollbar {
          scrollbar-width: thin;
          scrollbar-color: #334155 #0b0f1a;
        }

        .logo-bracket {
            color: var(--brand-yellow);
            font-weight: 300;
            font-size: 1.4em;
        }
        
        .brand-shadow {
            box-shadow: 0 10px 30px -10px rgba(250, 204, 21, 0.2);
        }

        .bg-navy-gradient {
            background: linear-gradient(135deg, #101828 0%, #0f172a 100%);
        }
    </style>
<script type="importmap">

</head>

</body>
</html>
